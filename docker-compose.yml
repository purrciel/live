version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-live
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: live_dev
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: live_seaweedfs_live
    ports:
      - "9333:9333" # Master (управление)
      - "8888:8888" # Filer (файловый API)
      - "8333:8333" # S3 API
    command: 'server -s3 -dir=/data'
    volumes:
      - ./seaweed_data:/data:Z
    restart: unless-stopped
